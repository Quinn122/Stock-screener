name: Update screener data

on:
  schedule:
    # 22:30 UTC, Mon-Fri = 6:30pm EDT / 5:30pm EST, i.e. after the US close
    # in both summer and winter time. (GitHub cron is always UTC.)
    - cron: "30 22 * * 1-5"
  workflow_dispatch: {}   # lets you run it by hand from the Actions tab

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/update_screener.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
